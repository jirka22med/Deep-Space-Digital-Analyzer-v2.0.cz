<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCARS | Deep Space Digital Analyzer v2.0</title>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <link rel="icon" href="https://img40.rajce.idnes.cz/d4003/19/19517/19517492_984d6887838eae80a8eb677199393188/images/image_82x82_2.jpg?ver=0" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <span>🖖 LCARS DEEP SPACE ANALYZER v2.0</span>
    <div class="status-indicator">
        <div class="status-dot active"></div>
        <div class="status-dot standby"></div>
    </div>
</div>

<div class="controls">
    <input type="file" id="fileInput" accept="audio/*">
    <audio id="mainAudio" controls></audio>
    <button class="btn" id="toggle3D" style="display: none;">3D View: OFF</button>
    <button class="btn" id="toggleEffect" style="display: none;">Effect: OFF</button>
    <button class="btn" id="exportBtn">📊 Export Analysis</button>
    <label style="color: #888; display: none">Reverb:</label>
    <input type="range" id="reverbLevel" style="display: none" min="0" max="100" value="0">
</div>

<div class="main-grid">
    <!-- VU Meters - centrovaný samostatný box -->
    <div class="box" style="grid-column: 1 / -1; width: 30%; margin: 0 auto;">
        <div class="box-title">🎚️ VU Meters (Stereo)</div>
        <div class="vu-container">
            <div class="vu-meter">
                <div class="vu-label">L</div>
                <div class="vu-bar-container">
                    <div class="vu-bar" id="vuLeft"></div>
                    <div class="vu-segments">
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                    </div>
                </div>
                <div class="vu-level-text" id="vuLeftText">-∞ dB</div>
            </div>
            <div class="vu-meter">
                <div class="vu-label">R</div>
                <div class="vu-bar-container">
                    <div class="vu-bar" id="vuRight"></div>
                    <div class="vu-segments">
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                        <div class="vu-segment"></div>
                    </div>
                </div>
                <div class="vu-level-text" id="vuRightText">-∞ dB</div>
            </div>
        </div>
    </div>

    <div class="box full" id="kontejner1" style="width: 75%; margin: 0 auto;">
        <div class="box-title">📊 Waveform Temporal Data</div>
        <div id="waveform"></div>
    </div>

    <!-- Wrapper pro centrování kontejnerů 2-3-4 -->
    <div style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 75%; margin: 0 auto;">
        <div class="box" id="kontejner2">
            <div class="box-title">🎵 Frequency Spectrum (D3.js)</div>
            <div id="d3_viz"></div>
        </div>

        <div class="box" id="kontejner3">
            <div class="box-title">🎯 Tonal Balance Radar</div>
            <div style="flex-grow: 1; position: relative; min-height: 150px;">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <div class="box" id="kontejner4">
            <div class="box-title">📈 Audio Information</div>
            <div class="info-panel">
                <div class="info-item">
                    <div class="info-label">Peak Freq</div>
                    <div class="info-value" id="peakFreq">--- Hz</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Duration</div>
                    <div class="info-value" id="duration">00:00</div>
                </div>  
            </div>
        </div>
    </div>

    <!-- Tyto tři řádky zatím deaktivovány, protože jsou ještě ve vývoji -->
    <div class="box triple" style="display: none;">
        <div class="box-title" style="display: none;">🌌 3D Spectral View (Three.js)</div>
        <div id="threeContainer" style="display: none;"></div>
    </div>  

    <div class="box full" id="kontejner5" style="width: 75%; margin: 0 auto;">
        <div class="box-title">🔥 Spectrogram (Plotly)</div>
        <div id="spectrogramPlot"></div>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
